services:
  db:
    image: postgres:16
    container_name: agentservice-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentservice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentservice"]
      interval: 5s
      timeout: 3s
      retries: 12

  java:
    build: ./java-ticket-service
    container_name: agentservice-java
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agentservice
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  python:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentservice-python
    environment:
      TICKET_SERVICE_URL: http://java:8080
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    volumes:
      - sessions:/app/backend/data
    depends_on:
      java:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ping',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: agentservice-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  sessions:
